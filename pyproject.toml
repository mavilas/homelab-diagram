[project]
name = "homelab-diagram"
version = "0.2.0"
description = "Homelab-style diagrams: an importable style library and an offline YAML/JSON spec renderer"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pyyaml>=6.0",
    "pillow>=9.0",
]

[project.scripts]
homelab-diagram = "homelab_diagram.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["homelab_diagram"]
